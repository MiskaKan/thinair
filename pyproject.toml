# thinair — probabilistic objects from plural beliefs.
# Stdlib only at runtime: no dependencies are declared because there are
# none.  pytest is the one development tool.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinair"
version = "2.2.0"
description = "Python objects whose attributes are beliefs, not values — the LLM as a measurement instrument for data no parser can read"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Miska Kankkonen" }]
keywords = ["llm", "measurement", "beliefs", "probabilistic", "data-analysis",
            "structured-output", "validation", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/MiskaKan/thinair"

[project.scripts]
thinair = "thinair.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["thinair*"]

[tool.setuptools.package-data]
thinair = ["GROUNDING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
