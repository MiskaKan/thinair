# thinair — probabilistic objects from plural beliefs.
# Stdlib only at runtime: no dependencies are declared because there are
# none.  pytest is the one development tool.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinair"
version = "0.1.0"
description = "Python objects whose attributes are beliefs, not values — the LLM as a measurement instrument for data no parser can read"
# The long description IS the grounding: the same file an LLM is meant to be
# handed with raw data.  The PyPI page teaches what the package teaches.
readme = { file = "thinair/GROUNDING.md", content-type = "text/markdown" }
keywords = ["llm", "measurement", "beliefs", "probabilistic", "data-analysis",
            "structured-output", "validation", "calibration"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["thinair*"]

[tool.setuptools.package-data]
thinair = ["GROUNDING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
